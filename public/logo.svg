<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" width="300" height="60">
  <!-- Icon Group -->
  <g transform="translate(30, 30)">
    <!-- Background Circle -->
    <circle r="28" fill="#f4e4bc" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Sun -->
    <circle cx="10" cy="-15" r="4" fill="#e74c3c" />
    
    <!-- Mountains -->
    <path d="M-20,15 L-5,-15 L15,15 L25,-5 L35,25 L-25,25 Z" fill="#d97757" stroke="#2c3e50" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Ground Line -->
    <path d="M-28,18 L28,18" stroke="#2c3e50" stroke-width="1.5"/>
  </g>
  
  <!-- Text Group -->
  <g transform="translate(70, 0)">
    <text x="0" y="28" font-family="Georgia, serif" font-weight="bold" font-size="24" fill="#2c3e50" letter-spacing="1">NORTH GA</text>
    <text x="0" y="50" font-family="Courier New, monospace" font-weight="bold" font-size="18" fill="#d97757" letter-spacing="3">RUNNING</text>
    
    <!-- Decorative Line -->
    <line x1="0" y1="33" x2="140" y2="33" stroke="#2c3e50" stroke-width="1" />
  </g>
</svg>
